#
# Portal — Hermes Agent (minimal build from source)
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose -f docker-compose.portal.yml up -d --build
#
# Updates:
#   git fetch upstream && git merge upstream/main
#   docker compose -f docker-compose.portal.yml up -d --build
#

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-portal:latest
    container_name: portal-agent
    restart: unless-stopped
    ports:
      - "${PORTAL_API_PORT:-8647}:8642"
    command: ["gateway", "run"]
    shm_size: 1g
    volumes:
      - ${PORTAL_DATA:-/home/angrynrrd/portal}:/opt/data
      # Obsidian vault — shared notes at /opt/vault (rw; append :ro to make read-only)
      - ${OBSIDIAN_VAULT:-/home/angrynrrd/Nextcloud/Shady/files}:/opt/vault
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-false}
      - API_SERVER_HOST=${API_SERVER_HOST:-0.0.0.0}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - API_SERVER_CORS_ORIGINS=${API_SERVER_CORS_ORIGINS:-*}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"

  portal-dashboard:
    image: hermes-portal:latest
    container_name: portal-dashboard
    restart: unless-stopped
    ports:
      - "9122:9119"
    depends_on:
      - portal
    volumes:
      - ${PORTAL_DATA:-/home/angrynrrd/portal}:/opt/data
      # Obsidian vault — shared notes at /opt/vault (rw; append :ro to make read-only)
      - ${OBSIDIAN_VAULT:-/home/angrynrrd/Nextcloud/Shady/files}:/opt/vault
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_HOME=/opt/data
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"
