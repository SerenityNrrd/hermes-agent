#
# Zora — Hermes Agent (gateway + dashboard in one container)
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose -f docker-compose.zora.yml up -d --build
#

services:
  zora:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-zora:latest
    container_name: zora
    restart: unless-stopped
    command: ["gateway", "run"]
    shm_size: 1g
    volumes:
      - ${ZORA_DATA:-/home/hermes/data}:/opt/data
      # Obsidian vault — shared notes at /opt/vault (rw; append :ro to make read-only)
      - ${OBSIDIAN_VAULT:-/home/hermes/vault}:/opt/vault
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_HOME=/opt/data
      - HERMES_DASHBOARD=1
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-false}
      - API_SERVER_HOST=${API_SERVER_HOST:-0.0.0.0}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - API_SERVER_CORS_ORIGINS=${API_SERVER_CORS_ORIGINS:-*}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
