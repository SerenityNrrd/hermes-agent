#
# Zora — Hermes Agent (minimal build from source)
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose -f docker-compose.zora.yml up -d --build
#
# Updates:
#   git fetch upstream && git merge upstream/main
#   docker compose -f docker-compose.zora.yml up -d --build
#

services:
  zora:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-zora:latest
    container_name: zora-agent
    restart: unless-stopped
    command: ["gateway", "run"]
    shm_size: 1g
    volumes:
      - ${ZORA_DATA:-/home/angrynrrd/zoraToo}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-false}
      - API_SERVER_HOST=${API_SERVER_HOST:-0.0.0.0}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - API_SERVER_CORS_ORIGINS=${API_SERVER_CORS_ORIGINS:-*}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    ports:
      - "${ZORA_API_PORT:-8645}:8642"

  zora-dashboard:
    image: hermes-zora:latest
    container_name: zora-dashboard
    restart: unless-stopped
    depends_on:
      - zora
    entrypoint: ["/opt/hermes/.venv/bin/python", "-m", "hermes_cli"]
    environment:
      - HERMES_HOME=/tmp/hermes-dashboard
      - HERMES_DASHBOARD_INSECURE=1
    command: ["dashboard", "--host", "0.0.0.0", "--no-open", "--insecure"]
    ports:
      - "${ZORA_DASHBOARD_PORT:-9120}:9119"
