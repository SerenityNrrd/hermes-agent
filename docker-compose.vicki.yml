#
# Vicki — Hermes Agent with MS Teams + Playwright extras
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose -f docker-compose.vicki.yml up -d --build
#
# Updates:
#   git fetch upstream && git merge upstream/main
#   docker compose -f docker-compose.vicki.yml up -d --build
#

services:
  vicki:
    build:
      context: .
      dockerfile: Dockerfile.vicki
    image: hermes-vicki:latest
    container_name: vicki-agent
    restart: unless-stopped
    ports:
      - "8646:8642"
      - "3978:3978"
    command: ["gateway", "run"]
    shm_size: 1g
    volumes:
      - ${VICKI_DATA:-/home/angrynrrd/hermes}:/opt/data
      # Obsidian vault — shared notes at /opt/vault (rw; append :ro to make read-only)
      - ${OBSIDIAN_VAULT:-/home/angrynrrd/Nextcloud/Shady/files}:/opt/vault
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-true}
      - API_SERVER_HOST=${API_SERVER_HOST:-0.0.0.0}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - API_SERVER_CORS_ORIGINS=${API_SERVER_CORS_ORIGINS:-*}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"

  vicki-dashboard:
    image: hermes-vicki:latest
    container_name: vicki-dashboard
    restart: unless-stopped
    ports:
      - "9121:9119"
    depends_on:
      - vicki
    volumes:
      - ${VICKI_DATA:-/home/angrynrrd/hermes}:/opt/data
      # Obsidian vault — shared notes at /opt/vault (rw; append :ro to make read-only)
      - ${OBSIDIAN_VAULT:-/home/angrynrrd/Nextcloud/Shady/files}:/opt/vault
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_HOME=/opt/data
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
